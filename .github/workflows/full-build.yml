name: Full build

# Manual only. Builds the 20 matches from the base's CLI, runs every --check that exists and the two
# README blocks through scripts/clean_clone_check.sh (quick and full), on a clean machine.
#
# SkillCorner's Git LFS quota: a full download is 1,823,448,331 B of it. So the verified raw files are
# cached under a key made from the base's manifest (the file that lists every path and sha256), and:
#   cold cache: the quick block downloads its 5 files (95.6 MB), the full block downloads the 85 once,
#               and the verified raw files are then saved under the key;
#   warm cache: nothing is downloaded. Each block gets a copy of the raw files in its own
#               FTBASE_DATA_ROOT, so `ftbase ingest` sees every file present and matching and skips it
#               (the quick block gets only its match's files, so its bronze and silver stay at 1 match).
# The README blocks are not changed for this: they run as a reader would, only the data root differs.
# The checks at the end read the silver that the full block built, in the same data root.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MATCH: "1874553"
    steps:
      - name: Work directories (the runner context is not available in job-level env)
        run: |
          {
            echo "QUICK_ROOT=$RUNNER_TEMP/data-quick"
            echo "FULL_ROOT=$RUNNER_TEMP/data-full"
            echo "RAW_CACHE=$RUNNER_TEMP/raw-cache"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false
          fetch-depth: 0 # the guard of the held-out reads the whole history; the reading is a past commit
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.10.4"
      - name: Python from .python-version
        run: uv python install
      - run: uv sync --locked

      - name: Fingerprint of the base's manifest
        id: manifest
        run: |
          manifest="$(uv run python -c "import pathlib, ftbase; print(pathlib.Path(ftbase.__file__).parent / 'manifest' / 'sources.json')")"
          echo "hash=$(sha256sum "$manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      - name: Raw data cache
        id: raw
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.RAW_CACHE }}
          key: raw-opendata-football-${{ steps.manifest.outputs.hash }}
      - name: Say whether the cache is warm
        run: echo "cache-hit=${{ steps.raw.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Seed the quick data root with its match's files (warm cache)
        if: steps.raw.outputs.cache-hit == 'true'
        run: |
          uv run python - "${{ steps.manifest.outputs.manifest }}" <<'PY'
          import os, shutil, sys
          from pathlib import Path
          from ftbase.ingest.manifest import load_manifest
          from ftbase.ingest.select import select_match
          source = select_match(load_manifest(Path(sys.argv[1])).source("opendata-football"), int(os.environ["MATCH"]))
          cached = Path(os.environ["RAW_CACHE"]) / "raw" / source.source_id
          seeded = Path(os.environ["QUICK_ROOT"]) / "raw" / source.source_id
          for entry in source.files:
              (seeded / entry.path).parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(cached / entry.path, seeded / entry.path)
          print(f"seeded {len(source.files)} files")
          PY
      - name: Seed the full data root with every verified file (warm cache)
        if: steps.raw.outputs.cache-hit == 'true'
        run: mkdir -p "$FULL_ROOT" && cp -r "$RAW_CACHE/raw" "$FULL_ROOT/raw"

      # AC2_REPO: the repo is private, so the clone takes the checkout (committed state only).
      - name: README block quick
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/w-quick"
          TMPDIR="$RUNNER_TEMP/w-quick" FTBASE_DATA_ROOT="$QUICK_ROOT" AC2_REPO="$GITHUB_WORKSPACE" \
            bash scripts/clean_clone_check.sh quick 2>&1 | tee "$RUNNER_TEMP/quick.log"
      - name: README block full
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/w-full"
          TMPDIR="$RUNNER_TEMP/w-full" FTBASE_DATA_ROOT="$FULL_ROOT" AC2_REPO="$GITHUB_WORKSPACE" \
            bash scripts/clean_clone_check.sh full 2>&1 | tee "$RUNNER_TEMP/full.log"
      - name: Save the verified raw files (cold cache; the full block verified all 85)
        if: steps.raw.outputs.cache-hit != 'true'
        run: mkdir -p "$RAW_CACHE" && cp -r "$FULL_ROOT/raw" "$RAW_CACHE/raw"
      - name: Cache the raw files
        if: steps.raw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.RAW_CACHE }}
          key: raw-opendata-football-${{ steps.manifest.outputs.hash }}

      # Every --check that exists today, on the silver the full block built. Each prints how many
      # cells or rules it verified; a check that verified nothing is a failure, not a pass.
      - name: ac2fb protocol --check
        run: uv run ac2fb protocol --check
      - name: ac2fb reliability --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb reliability --check
      - name: ac2fb layer2 --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb layer2 --check
      - name: ac2fb amputation --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb amputation --check
      - name: ac2fb cadence --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb cadence --check
      - name: ac2fb s1 --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb s1 --check
      - name: ac2fb s2 --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb s2 --check
      - name: ac2fb s3 --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb s3 --check
      - name: ac2fb power --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb power --check
      - name: ac2fb design --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb design --check
      - name: ac2fb calibration --check
        run: FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb calibration --check
      - name: ac2fb figures --check
        run: uv run ac2fb figures --check

      # The held-out half of those checks. Each one above says PARTIAL 10/20: the held-out opens only
      # inside `ac2fb heldout read`, in a checkout whose HEAD holds the code frozen for the reading,
      # and HEAD here does not (the code has moved on). So the reading is reproduced in a git
      # worktree at the reading commit, with its own environment from that commit's uv.lock, and its
      # three artefacts are compared byte for byte with reports/heldout/. With this step the 20
      # matches are verified. Layer 3 died before any reading, so only layer 2 has a held-out half.
      - name: Held-out half, reproduced from the reading commit
        run: |
          reading="$(git log --format=%H --grep='^Read the held-out for layer 2: the single reading$' HEAD)"
          if [ -z "$reading" ] || [ "$(echo "$reading" | wc -l)" -ne 1 ]; then
            echo "expected exactly one reading commit, found: ${reading:-none}"; exit 1
          fi
          echo "reading commit: $reading"
          git worktree add --detach "$RUNNER_TEMP/reading" "$reading"
          cd "$RUNNER_TEMP/reading"
          uv sync --locked
          FTBASE_DATA_ROOT="$FULL_ROOT" uv run ac2fb heldout read --reports-dir "$RUNNER_TEMP/reproduced"
          cd "$GITHUB_WORKSPACE"
          bash scripts/compare_heldout_reading.sh "$RUNNER_TEMP/reproduced"
      - name: Remove the worktree of the reading
        if: always()
        run: git worktree remove --force "$RUNNER_TEMP/reading" || true

      - name: Times and bytes
        if: always()
        run: |
          {
            echo "## Measured"
            for mode in quick full; do
              log="$RUNNER_TEMP/$mode.log"
              [ -f "$log" ] || continue
              bytes="$(sed -n 's/^downloaded: .* (\([0-9]*\) bytes)$/\1/p' "$log" | paste -sd+ - | bc)"
              echo "- $mode: $(grep -E '^(CLEAN CLONE OK|FAIL)' "$log" | head -1); downloaded bytes: ${bytes:-0}"
            done
            echo "- cache-hit: ${{ steps.raw.outputs.cache-hit }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
