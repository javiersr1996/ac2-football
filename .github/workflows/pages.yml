# Publishes the committed camera page as it is, at https://javiersr1996.github.io/ac2-football/.
# Not rebuilt here: `scripts/camera_page.py --check` in full-build.yml proves the build from the
# data, and `--check-static` in ci.yml proves the page holds its sidecar. Copied from the author's
# basketball entry (nobody-helps-the-helper, .github/workflows/pages.yml), the path changed.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: mkdir _site && cp reports/camera/what_the_camera_saw.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
