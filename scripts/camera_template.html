<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the camera saw</title>
<meta name="description" content="One reception of SkillCorner's open A-League tracking on one screen: drawn from the camera's side with the camera's measured frame on the grass and from above with the V0/V1 switch, its measures in tabs beside it. Keep a metric to what the camera saw whole and line depth and block length become a different sample. Every number is read from a file of the repository.">
<!--
  Built by scripts/camera_page.py into reports/camera/what_the_camera_saw.html: the payload
  (reports/camera/camera.json) and three.js (vendor/three) are inlined, nothing is fetched.
  Copied, with a declaration, from the author's basketball entry
  (github.com/javiersr1996/nobody-helps-the-helper, scripts/wind_template.html, MIT): the
  window.THREE shim, the renderer and compileAsync, the rise (flight), project and unproject,
  the placement of the tags, the scrubber with ticks and the no-WebGL fallback.
-->
<style>
:root{
  --bg:#fbfbf8; --paper:#ffffff; --ink:#222222; --dim:#444444; --faint:#5f5f5f; --grey:#777777;
  --line:#dfe2da; --line-2:#c8cdc2; --blue:#0072b2; --vermilion:#d55e00; --green:#009e73;
  --vermilion-ink:#a94b00; --green-ink:#00775a; --wash:#eef2ea; --grass:#f1f5ec; --sky:#dfe3da;
  --head:#1b1f1a; --on-head:#ffffff; --on-head-dim:#d3d9cf; --on-head-rule:rgba(255,255,255,.75);
  --side:clamp(320px,34vw,460px); --thumb:44px; --gutter:20px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
     line-height:1.5}
a{color:var(--ink);text-decoration-color:var(--line-2);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.q{font-variant-numeric:tabular-nums;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);
    white-space:nowrap;border:0}

/* ------------------------------------------------------------ one screen */
/* The page is one screen and never scrolls: a grid of the header (the title and the thesis), the
   stage (the scene), the control bar under it and the panel of tabs, whose body alone scrolls.
   Landscape: the panel on the right, the header across the top, or at the head of the panel's
   column when the window is short (a phone held sideways). Portrait: header, stage, controls,
   tabs, one under the other. */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) var(--side);
     grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "stage panel" "ctrl panel"}
.top{grid-area:head;min-width:0;background:var(--head);color:var(--on-head);padding:10px 24px 12px;
     display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"eyebrow thesis" "title thesis";
     column-gap:28px;align-items:end}
.top h1{grid-area:title}
.thesis{grid-area:thesis}
.eyebrow{grid-area:eyebrow;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
         color:var(--on-head-dim);margin:0 0 2px}
h1{font-size:clamp(26px,2.6vw,38px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em;
   white-space:nowrap}
.thesis{margin:0;font-size:clamp(16px,1.25vw,18px);line-height:1.4;max-width:84ch}
.thesis .q{font-weight:700}

/* ------------------------------------------------------------ the stage */
.stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--sky)}
.stage canvas{position:absolute;left:0;top:0;display:block;width:100%;height:100%;touch-action:manipulation}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* a tag is ink on an opaque card: vermilion (a defender) or blue (the receiver) only as its mark */
.tag{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap;font-size:13px;font-weight:700;
     line-height:1.2;padding:1px 5px 1px 4px;border-radius:2px;background:var(--paper);color:var(--ink);
     border:1px solid var(--line-2);border-left:3px solid var(--vermilion)}
.tag.me{border-left-color:var(--blue)}
.tag.measure{border-left-width:1px;font-weight:600;font-size:14px;white-space:pre;text-align:center}
.tag.measure.off,.tag.faded{color:var(--faint);font-weight:600}
.tag.faded{border-left-color:#efc6a6}
.leaders{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.leaders line{stroke-linecap:round}
.leaders .halo{stroke:rgba(255,255,255,.85);stroke-width:4}
.leaders .lead{stroke:var(--vermilion);stroke-width:1.6}
.leaders .lead.me,.leaders .lead.measure{stroke:var(--ink)}
.foot{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;display:flex;align-items:flex-end;gap:10px;
      pointer-events:none}
.count{background:var(--paper);border:1px solid var(--line-2);padding:5px 10px;line-height:1.15;flex:none}
.count .n{font-size:24px;font-weight:800;color:var(--vermilion-ink);font-variant-numeric:tabular-nums}
.count .w{font-size:13px;color:var(--dim)}
.count .clock{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.count.big .n{font-size:30px}
.key{list-style:none;margin:0;padding:5px 10px;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;
     line-height:1.3;color:var(--dim);background:var(--paper);border:1px solid var(--line-2);min-width:0}
.key li{display:flex;align-items:center;gap:4px}
.key b{color:var(--ink);font-weight:600;margin-right:2px}
.key svg{flex:none}
.key .note{color:var(--faint)}
/* compact screens: the key as one line over the scene (the whole key closes the Story tab) */
.keystrip{position:absolute;left:8px;top:8px;z-index:2;display:none;align-items:center;gap:4px 10px;margin:0;
          padding:3px 8px;list-style:none;font-size:13px;line-height:1.3;color:var(--dim);background:var(--paper);
          border:1px solid var(--line-2);pointer-events:none;white-space:nowrap}
.keystrip li{display:flex;align-items:center;gap:3px}
.keystrip{flex-wrap:wrap;max-width:calc(100% - 16px)}
.keystrip li.br{flex-basis:100%;height:0}
.count .note{display:block;font-size:13px;font-weight:400;color:var(--dim);margin-top:2px}
/* no WebGL: the clip's still of the reception, whole inside the stage, its caption under it; the
   counter and the key belong to the drawn scene and the still carries its own */
.no-gl{position:absolute;inset:0;margin:0;padding:12px;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:8px;background:var(--paper)}
.no-gl img{display:block;flex:0 1 auto;min-height:0;max-width:100%;object-fit:contain}
.no-gl figcaption{flex:none;font-size:17px;line-height:1.35;text-align:center}
.flat .foot,.flat .keystrip,.flat .key{display:none}

/* ------------------------------------------------------------ the control bar */
/* one row: Play, the scrubber, the view; the ticks' label runs under the row */
.controls{grid-area:ctrl;min-width:0;background:var(--head);color:var(--on-head);padding:8px 16px 24px;
          display:flex;flex-wrap:nowrap;align-items:flex-start;gap:12px}
.controls :focus-visible{outline-color:#fff}
.btn{flex:none;border:1px solid #fff;background:#fff;color:var(--ink);font-size:15px;font-weight:600;
     padding:0 12px;border-radius:3px;cursor:pointer;min-width:64px;height:44px}
.btn[disabled],.seg button[disabled]{opacity:.4;cursor:default}
.scrubwrap{flex:1 1 0;min-width:64px;position:relative}
#scrub{-webkit-appearance:none;appearance:none;display:block;width:100%;height:var(--thumb);margin:0;
       background:transparent;cursor:pointer;--f:0}
#scrub:disabled{opacity:.4;cursor:default}
#scrub::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(to right,#fff calc(var(--f) * (100% - var(--thumb)) + var(--thumb) / 2),
                             rgba(255,255,255,.3) 0)}
#scrub::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
#scrub::-moz-range-progress{height:6px;border-radius:3px;background:#fff}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:var(--thumb);height:var(--thumb);margin-top:-19px;
  border:0;border-radius:50%;background:radial-gradient(circle,#fff 0 9px,rgba(255,255,255,.2) 10px 20px,transparent 21px)}
#scrub::-moz-range-thumb{width:var(--thumb);height:var(--thumb);border:0;border-radius:50%;
  background:radial-gradient(circle,#fff 0 9px,rgba(255,255,255,.2) 10px 20px,transparent 21px)}
.ticks{position:absolute;left:0;right:0;top:calc(var(--thumb) / 2 + 8px);height:22px;font-size:12px;
       color:var(--on-head-dim)}
.tick{position:absolute;top:0;width:1px;height:6px;background:var(--on-head-dim)}
.tick-label{position:absolute;top:18px;white-space:nowrap;line-height:1.2;transform:translateX(-4px)}
.tick,.tick-label{left:calc(var(--f) * (100% - var(--thumb)) + var(--thumb) / 2)}
.seg{flex:none;display:flex;border:1px solid var(--on-head-rule);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;font-size:15px;padding:0 12px;cursor:pointer;
            height:44px;min-width:44px;white-space:nowrap}
.seg button + button{border-left:1px solid var(--on-head-rule)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600}
.seg .long{display:none}
/* the V0/V1 switch beside the readout, on paper */
.seg.light{border-color:var(--ink)}
.seg.light button{color:var(--ink)}
.seg.light button + button{border-left-color:var(--ink)}
.seg.light button[aria-pressed=true]{background:var(--ink);color:#fff}

/* ------------------------------------------------------------ the panel */
.panel{grid-area:panel;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--paper);
       border-left:1px solid var(--line-2)}
/* the readout: this match's means of the reception's two metrics, V0 against V1, with the switch.
   Full (a landscape window 760 px high or more): a row per metric, its n under each mean; compact:
   one short row per metric, V0 to V1, the switch beside them. */
.readout{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"cap seg" "tab tab";
         align-items:center;gap:2px 12px;padding:6px var(--gutter) 6px;border-bottom:1px solid var(--line)}
.readout .rcap{grid-area:cap;margin:0;font-size:13px;color:var(--faint)}
.readout .seg{grid-area:seg;justify-self:end}
.readout .ptab{grid-area:tab}
.ptab{border-collapse:collapse;width:100%}
.ptab th,.ptab td{padding:1px 10px 1px 0;border:0;text-align:left;vertical-align:baseline;line-height:1.25;
                  font-variant-numeric:tabular-nums}
.ptab tr.ref th{padding-top:4px;font-size:15px;font-weight:600}
.ptab tr.ref:first-child th{padding-top:0}
.ptab tr.ref th span{font-size:13px;font-weight:400;color:var(--faint)}
.ptab.compact th{font-size:14px;font-weight:600;padding-right:12px;white-space:nowrap}
.ptab.compact td{font-size:14px;padding-right:6px;white-space:nowrap}
.ptab.compact .num{display:inline;font-size:15px}
.ptab.compact .on .num{font-size:15px}
.readout.compact{grid-template-areas:"cap seg" "tab seg";row-gap:0;padding-top:5px;padding-bottom:5px}
.readout.compact .rcap{line-height:1.2}
.ptab.compact th,.ptab.compact td{line-height:1.25;padding-top:0;padding-bottom:0}
.ptab .num{display:block;font-size:16px;color:var(--dim);font-weight:600;white-space:nowrap}
.ptab .on .num{font-size:20px;font-weight:800;color:var(--ink)}
.ptab .on.v1 .num{color:var(--green-ink)}
.ptab .n{display:block;font-size:13px;color:var(--faint)}
.ptab .diff .num{color:var(--ink)}
.tablist{flex:none;display:flex;padding:0 8px;border-bottom:1px solid var(--line-2)}
.tab{flex:1 1 auto;min-width:44px;height:46px;padding:0 8px;border:0;border-bottom:3px solid transparent;
     margin-bottom:-1px;background:none;color:var(--dim);font-size:15px;font-weight:600;cursor:pointer;
     white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible{outline-offset:-3px}
/* only the tab's body scrolls; a soft shade at its top and bottom says there is more */
.tabpanel{flex:1 1 0;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px var(--gutter) 18px;
  background:linear-gradient(var(--paper) 30%,rgba(255,255,255,0)) top / 100% 24px no-repeat local,
             linear-gradient(rgba(255,255,255,0),var(--paper) 70%) bottom / 100% 24px no-repeat local,
             radial-gradient(farthest-side at 50% 0,rgba(0,0,0,.1),transparent) top / 100% 8px no-repeat scroll,
             radial-gradient(farthest-side at 50% 100%,rgba(0,0,0,.1),transparent) bottom / 100% 8px no-repeat scroll;
  background-color:var(--paper)}
.tabpanel:focus-visible{outline-offset:-3px}
.tabpanel h2{font-size:19px;line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
.tabpanel h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:18px 0 4px}
.tabpanel p{margin:0 0 10px}
.tabpanel > :last-child{margin-bottom:0}
.src{color:var(--faint);font-size:13px}
.hint{color:var(--faint)}
.mtab{border-collapse:collapse;width:100%;margin:2px 0 10px}
.mtab th,.mtab td{text-align:right;padding:3px 0 3px 10px;border-bottom:1px solid var(--line);
                  font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:top;line-height:1.3}
.mtab th:first-child,.mtab td:first-child{text-align:left;white-space:normal;padding-left:0}
.mtab thead th{font-weight:600;color:var(--dim);font-size:14px}
.mtab .n{display:block;font-size:13px;color:var(--faint)}
.mtab .on{background:var(--wash)}
.mtab tr.unit td:first-child{font-weight:700}
.mtab tbody tr{cursor:default}
.mtab tbody tr.linked{cursor:pointer}
.mtab tr.linked td:first-child::after,.hint .ring{content:"";display:inline-block;width:9px;height:9px;
  margin-left:6px;border:1.5px solid var(--ink);border-radius:50%;vertical-align:baseline}
.chart{position:relative;margin-top:4px}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:13px;fill:var(--ink)}
.chart .small{font-size:12px;fill:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--dim);margin:0 0 6px}
.legend span{display:flex;align-items:center;gap:6px}
.vtab{border-collapse:collapse;width:100%;margin:0 0 4px;font-size:14px;table-layout:fixed}
.vtab col.g{width:28%}
.vtab col.n{width:24%}
.vtab col.c{width:3.9em}
.vtab th,.vtab td{padding:1px 6px 1px 0;text-align:left;vertical-align:top;line-height:1.3;border:0}
.vtab thead th{font-size:13px;font-weight:600;color:var(--faint);white-space:nowrap}
.vtab tbody th{font-size:13px}
.vtab thead th.c,.vtab td.c{text-align:right;font-variant-numeric:tabular-nums;padding-right:0;padding-left:6px}
.vtab tbody th{font-weight:700;color:var(--ink);padding-right:10px}
.vtab tr.first > *{border-top:1px solid var(--line);padding-top:4px}
.vtab caption{caption-side:top;text-align:left;font-size:13px;line-height:1.35;color:var(--faint);padding:0 0 4px}
.vtab thead th.c{white-space:normal;line-height:1.2}
ol.conclusions{padding-left:20px;margin:0 0 10px}
ol.conclusions li{margin:0 0 4px;line-height:1.4}
ol.conclusions + .vtab{margin-top:2px}
.vtab + ol.conclusions{margin-top:10px}
.more{color:var(--dim)}
.tabpanel .thesis{color:var(--ink);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.more a{display:inline-block;padding:11px 0;margin:-11px 0}
ol.limits{padding-left:22px;margin:0}
ol.limits li{margin:0 0 10px;color:var(--dim)}
code{font-family:var(--mono);font-size:15px;overflow-wrap:anywhere}
.about{margin-top:18px;padding-top:2px;border-top:1px solid var(--line);color:var(--dim)}
.about pre{background:var(--bg);border:1px solid var(--line);padding:10px 12px;font-family:var(--mono);
           font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.about a{display:inline-block;padding:11px 0}

@media (orientation:landscape) and (min-width:1200px) and (min-height:760px){.readout .seg .long{display:inline}}
/* portrait: header, stage, controls, tabs; the tab list first in the panel, then the readout,
   then a body of a fixed share of the screen; the stage takes what is left */
@media (orientation:portrait){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
       grid-template-areas:"head" "stage" "ctrl" "panel"}
  .panel{border-left:0}
  .tablist{order:-1}
  .tabpanel{flex:none;height:calc(max(160px,25vh) + 36px)}
  .top{display:block;padding:8px 16px 10px}
  h1{font-size:min(24px,7vw)}
  .thesis{margin-top:2px}
}
/* compact (portrait, or a window under 561 px high): no eyebrow, a smaller title, the key as a
   strip over the scene and whole at the end of Story, the counter on one line */
@media (orientation:portrait),(max-height:560px){
  .eyebrow{display:none}
  .thesis{font-size:16px}
  .tablist{padding:0}
  .tab{padding:0 4px;font-size:14px}
  .tabpanel{padding:12px 16px 16px}
  .tabpanel .key{padding:10px 0 0;border:0;border-top:1px solid var(--line);background:none;font-size:14px;margin:14px 0 0}
  .keystrip{display:flex}
  .readout{padding-left:16px;padding-right:16px}
  .foot{left:8px;right:8px;bottom:8px}
  .count{padding:3px 8px;flex:0 1 auto}
  .count > div:first-child{display:inline}
  .count .clock{display:inline;margin-left:6px}
  .count .n,.count.big .n{font-size:20px}
  .controls{padding:6px 12px 24px;gap:8px}
  .btn{min-width:56px;padding:0 8px}
  .seg button{padding:0 9px;font-size:14px}
}
@media (orientation:landscape) and (max-height:759px){.eyebrow{display:none}.tabpanel{padding:8px 16px 10px}}
@media (orientation:landscape) and (max-height:560px){
  .top{padding:6px 16px 8px}
  h1{font-size:22px}
}
/* a short screen (640 px high or less): the stage keeps its height, the key closes the Story tab */
@media (max-height:640px){.keystrip{display:none}}
@media (orientation:portrait) and (max-height:640px){
  .tick-label{display:none}
  .controls{padding-bottom:6px}
}
@media (max-width:420px){
  .tab{padding:0 2px;font-size:13px}
}
@media (max-width:340px){.tab .n20{display:none}}
@media (max-width:360px){
  .count .wd{display:none}
  .controls .seg button{padding:0 7px;font-size:13px}
}
</style>
</head>
<body>

<main class="app" id="app">
  <header class="top" id="top">
    <p class="eyebrow">A reliability tag for defensive metrics</p>
    <h1>What the camera saw</h1>
    <p class="thesis" id="thesis"></p>
  </header>

  <section class="stage" id="stage" aria-label="the reception">
    <canvas id="pitch" role="img" aria-label="one reception, twenty-two players and the camera's frame on the pitch"></canvas>
    <div class="tags" id="tags" aria-hidden="true"></div>
    <ul class="keystrip" id="keystrip" aria-hidden="true"></ul>
    <div class="foot" id="foot">
      <div class="count" id="count" aria-live="off">
        <div><span class="n" id="count-n"></span> <span class="w" id="count-w"></span></div>
        <div class="clock" id="clock"></div>
        <div class="note" id="count-note"></div>
      </div>
      <ul class="key" id="key" aria-label="key"></ul>
    </div>
    <figure class="no-gl" id="no-gl" hidden>
      <img alt="The reception from above, drawn flat: the defenders the camera saw (filled discs), the ones the model filled in (rings, each with the seconds to its nearest detection), the receiver, the ball, the teammates and the count of defenders filled in." src="data:image/png;base64,/*CLIP_STILL*/">
      <figcaption>No WebGL here: the reception as a still.</figcaption>
    </figure>
  </section>

  <div class="controls" id="controls">
    <button class="btn" id="play" type="button">Play</button>
    <div class="scrubwrap">
      <input type="range" id="scrub" min="0" step="1" value="0" aria-label="time in the clip">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="seg" role="group" aria-label="camera">
      <button id="view-broadcast" type="button" aria-pressed="true">Broadcast</button>
      <button id="view-plan" type="button" aria-pressed="false">Top-down</button>
    </div>
    <p class="sr" id="stage-caption" aria-live="polite"></p>
  </div>

  <aside class="panel" id="panel" aria-label="the measures">
    <div class="readout" id="readout">
      <p class="rcap" id="readout-cap"></p>
      <div class="seg light" role="group" aria-label="variant">
        <button id="variant-v0" type="button" aria-pressed="true">V0<span class="long"> every unit</span></button>
        <button id="variant-v1" type="button" aria-pressed="false">V1<span class="long"> seen throughout</span></button>
      </div>
      <table class="ptab" id="panel-table" aria-label="this match's mean line depth and block length, V0 and V1"></table>
    </div>
    <div class="tablist" id="tablist" role="tablist" aria-label="the measures">
      <button class="tab" role="tab" type="button" id="tab-findings" data-tab="findings" aria-controls="tp-findings" aria-selected="true">Findings</button>

  // a tick at each unit's frame, and one line under them from the first: each tick's time from the reception
  const fromKey = u => {
    const v = (D.frames[u.index] - D.key.frame) / FPS;
    return q(`frames.${u.index}`, num(v, Number.isInteger(v) ? 0 : 1) + NB + "s");
  };
  for (const u of [U.block, U.line]) {
    const tk = document.createElement("div");
    tk.className = "tick";
    tk.style.setProperty("--f", String(u.index / (N - 1)));
    ticks.append(tk);
  }
  const lab = document.createElement("div");
  lab.className = "tick-label";
  lab.innerHTML = `phase start ${fromKey(U.block)} · reception ${fromKey(U.line)}`;
  lab.title = "phase start: block length is read here; the reception: line depth is read here";
  lab.style.setProperty("--f", String(Math.min(U.block.index, U.line.index) / (N - 1)));
  ticks.append(lab);
  scrub.max = String(N - 1);
  const three = D.three, cmd = [
    `uv run ftbase ingest --match ${D.match_id} && uv run ftbase bronze && uv run ftbase silver`,
    "uv run python scripts/camera_page.py            # writes reports/camera/",
    "uv run python scripts/camera_page.py --check    # recomputes and compares",
    "uv run --with playwright python scripts/drive_camera_page.py [path-or-url]"];
  at("about").innerHTML = "<h3>What this is</h3><p>The page of the entry <i>What the camera saw: a reliability tag for defensive metrics</i>:"
    + " <a href=\"https://github.com/javiersr1996/what-the-camera-saw\">github.com/javiersr1996/what-the-camera-saw</a>. It is built by"
    + " <code>scripts/camera_page.py</code> from <code>scripts/camera_template.html</code>, with <code>reports/camera/camera.json</code>"
    + " and <code>vendor/three/</code>, and driven from the console by <code>scripts/drive_camera_page.py</code>.</p>"
    + "<h3>Run it</h3><pre>" + cmd.map(esc).join("\n") + "</pre>"
    + "<h3>Licences and data</h3><p>Code: MIT. Data: SkillCorner open data, MIT, downloaded by the commands, not versioned here"
    + " (<a href=\"https://github.com/SkillCorner/opendata\">github.com/SkillCorner/opendata</a>). three.js r" + esc(three.release.split(".")[1])
    + ", MIT, inlined (<code>vendor/three/</code>). The page's build, template and console driver reuse the author's basketball entry (MIT),"
    + " <a href=\"https://github.com/javiersr1996/nobody-helps-the-helper\">nobody-helps-the-helper</a>.</p>";
}

/* ------------------------------------------------------------------ sizing */
/* Compact (a portrait screen, or a short one): the key and the V0/V1 readout open the Story tab;
   otherwise the key sits on the stage beside the counter and the readout heads the panel. Then
   the stage's size, the boxes of the counter, the key and the foot that holds them, and the
   plan's free region: the stage above the foot. Pixels. */
const COMPACT = window.matchMedia("(orientation: portrait), (max-height: 560px)");
const SHORT = window.matchMedia("(orientation: portrait), (max-height: 759px)");
/* a short screen (a small phone, or one held sideways): the thesis opens the Findings tab, open
   on load, and the header is the title */
const TINY = window.matchMedia("(max-height: 640px)");
const PORTRAIT = window.matchMedia("(orientation: portrait)");
function placeHomes() {
  const key = at("key"), story = at("tp-story"), thesis = at("thesis"), findings = at("tp-findings");
  if (TINY.matches) {
    if (findings.firstElementChild !== thesis) findings.prepend(thesis);
  } else if (thesis.parentNode !== at("top")) at("top").append(thesis);
  if (COMPACT.matches) {
    if (story.lastElementChild !== key) story.append(key);
  } else if (key.parentNode !== at("foot")) at("foot").append(key);
}
/** An element's box in the stage's pixels, or null when it is not on the stage. */
function onStage(id) {
  const box = at("stage"), node = at(id);
  if (!box.contains(node)) return null;
  const b = node.getBoundingClientRect(), r0 = box.getBoundingClientRect();
  return {x: b.left - r0.left, y: b.top - r0.top, w: b.width, h: b.height};
}
function sizeStage() {
  placeHomes();
  const box = at("stage"), w = Math.floor(box.clientWidth), h = Math.floor(box.clientHeight);
  at("app").classList.toggle("flat", !GL);
  if (!GL) return false;
  // the foot measured at its tallest: the counter as it reads on the reception, with its note
  drawCount(KEY, true);
  const foot = onStage("foot"), compact = COMPACT.matches;
  drawCount(current ? current.i : 0);
  const strip = onStage("keystrip"), band = compact && strip && strip.h > 0 ? Math.ceil(strip.y + strip.h + 4) : 0;
  if (w === size.w && h === size.h && compact === size.compact && size.foot && foot.y === size.foot.y && band === size.band) return false;
  Object.assign(size, {w, h, compact, band, region: {x0: 0, x1: w, y0: band, y1: foot.y - 6}, foot});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  look = null;
  return true;
}
function relayout() {
  if (sizeStage() && GL) { placeCamera(st.view === "plan" ? 1 : st.view === "rising" ? st.p : 0); drawAt(st.tau); }
  if (st.tab === "matches") renderStrips();
}

/* -------------------------------------------------------------------- start */
renderStatic();
const warm = GL ? (buildStage(), warmUp()) : null;
if (GL) buildTags();
sizeStage();
renderMeasure();
if (!GL) {
  at("no-gl").hidden = false;
  canvas.hidden = true;
  st.view = "plan";
  st.tau = T_KEY;
  st.p = 1;
  drawAt(T_KEY);
} else if (STILL) {
  st.view = "plan";
  st.tau = T_KEY;
  st.p = 1;
  st.risen = true;
  placeCamera(1);
  showMeasure(false);
  drawAt(T_KEY);
} else {
  // a portrait screen opens on the top-down view: there the clip plays from above with its
  // measures, and the camera's side is one press away
  const upright = PORTRAIT.matches;
  st.view = upright ? "plan" : "broadcast";
  st.p = upright ? 1 : 0;
  st.tau = 0;
  placeCamera(st.p);
  if (upright) showMeasure(false);
  drawAt(0, false);
  booting = true;
  warm.then(() => {
    if (!booting) return;
    drawAt(0);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (!booting) return;
      booting = false;
      startPlay();
    }));
  });
}
syncUI();
const watch = new ResizeObserver(relayout);
watch.observe(at("stage"));
watch.observe(at("panel"));
COMPACT.addEventListener("change", relayout);
SHORT.addEventListener("change", () => { relayout(); updateMeasure(); });
TINY.addEventListener("change", relayout);
</script>
</body>
